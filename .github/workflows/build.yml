name: Build Telegram X (Nicegram Edition)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          lfs: true

      - name: Checkout Git LFS
        run: git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          export TERM=xterm
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;23.2.8568313" "cmake;3.22.1"

      - name: Configure local.properties & API Credentials
        run: |
          API_ID="${{ secrets.TGX_API_ID }}"
          API_HASH="${{ secrets.TGX_API_HASH }}"

          # Fallback to test credentials if secrets are not set
          if [ -z "$API_ID" ]; then
            echo "::warning::TGX_API_ID secret not found! Using fallback test credentials."
            API_ID="21724"
            API_HASH="3e0cb5ab2c47c5d0124f114c000f074a"
          fi

          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/23.2.8568313
          app.id=org.nicegram.tgx
          app.name=Telegram X Nicegram
          telegram.api_id=$API_ID
          telegram.api_hash=$API_HASH
          EOF

          echo "✅ Generated local.properties successfully."

      - name: Run Telegram X Setup Script
        run: |
          export TERM=xterm
          chmod +x scripts/*.sh || true
          chmod +x gradlew
          # TGX setup script (компіляція TDLib та інших залежностей)
          ./scripts/setup.sh --skip-sdk-setup || true

      - name: Build APK with Gradle
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleUniversalRelease --stacktrace --no-daemon --build-cache
          else
            ./gradlew assembleUniversalDebug --stacktrace --no-daemon --build-cache
          fi

      - name: Locate and Rename APK
        id: apk
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/ \;
          APK_FILE=$(ls output_apk/*.apk | head -1)
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "📦 APK built: $APK_FILE"
          ls -lh output_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramX-Nicegram-APK
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
